<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Animated Nexora architecture</title>
  <desc id="desc">Requests flow from operators and agents through the Nexora API, policy engine, Circle infrastructure, Arc Testnet contracts, receipts, indexing, and analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset=".6" stop-color="#f7f8fc"/><stop offset="1" stop-color="#f1fbf7"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#312e81" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0284c7"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#059669"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .heading{font-size:27px;font-weight:760;fill:#1d1730}.subheading{font-size:13px;font-weight:680;letter-spacing:2px;fill:#6d28d9}
      .layer{font-size:12px;font-weight:750;letter-spacing:1.4px}.node{font-size:15px;font-weight:720;fill:#211a32}.copy{font-size:11.5px;font-weight:560;fill:#625b73}
      .purple{stroke:#7c3aed}.blue{stroke:#0284c7}.green{stroke:#059669}.rail{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.58}
      .dash{stroke-dasharray:7 11;animation:dash 6s linear infinite}.packet{filter:url(#glow)}
      @keyframes dash{to{stroke-dashoffset:-90}}@media (prefers-reduced-motion:reduce){.dash{animation:none}.packet{display:none}}
    </style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/><rect width="1400" height="850" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1398" height="848" rx="27" fill="none" stroke="#7c3aed" stroke-opacity=".18"/>
  <text x="56" y="60" class="subheading">SYSTEM MAP · ARC-FIRST PAYMENT CONTROL</text><text x="56" y="98" class="heading">How a Nexora payment moves</text><text x="56" y="126" class="copy" style="font-size:14px">Animated packets show requests, approved wallet execution, onchain settlement, and indexed evidence.</text>

  <g transform="translate(46 164)">
    <rect width="238" height="542" rx="22" fill="#fff" stroke="#7c3aed" stroke-opacity=".22"/><text x="24" y="34" class="layer" fill="#6d28d9">1 · USERS AND AGENTS</text>
    <g transform="translate(20 66)"><rect width="198" height="106" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-opacity=".3"/><circle cx="28" cy="31" r="10" fill="#7c3aed" fill-opacity=".1" stroke="#7c3aed"/><path d="M23 31H33M28 26V36" stroke="#7c3aed" stroke-width="2"/><text x="48" y="34" class="node">Operator console</text><text x="20" y="65" class="copy">Creates agents and policies</text><text x="20" y="84" class="copy">Reviews approval requests</text></g>
    <g transform="translate(20 194)"><rect width="198" height="106" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-opacity=".3"/><circle cx="28" cy="31" r="10" fill="#7c3aed" fill-opacity=".1" stroke="#7c3aed"/><path d="M23 34C23 26 33 26 33 34M25 26H31" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="48" y="34" class="node">Autonomous agent</text><text x="20" y="65" class="copy">Requests a paid resource</text><text x="20" y="84" class="copy">Carries service context</text></g>
    <g transform="translate(20 322)"><rect width="198" height="106" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-opacity=".3"/><text x="20" y="34" class="node">@nexorafi/x402</text><text x="20" y="65" class="copy">Middleware and SDK</text><text x="20" y="84" class="copy">Express · Next.js · clients</text></g>
    <g transform="translate(20 454)"><rect width="198" height="66" rx="16" fill="#f7f4fc" stroke="#7c3aed" stroke-opacity=".22"/><text x="20" y="28" class="copy">Request context</text><text x="20" y="47" class="node" style="font-size:12px">agent · service · amount · chain</text></g>
  </g>

  <g transform="translate(320 164)">
    <rect width="286" height="542" rx="22" fill="#fff" stroke="#7c3aed" stroke-opacity=".26"/><text x="24" y="34" class="layer" fill="#6d28d9">2 · NEXORA CONTROL PLANE</text>
    <g transform="translate(20 66)"><rect width="246" height="82" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-opacity=".32"/><text x="20" y="32" class="node">TypeScript API</text><text x="20" y="55" class="copy">Auth · idempotency · orchestration</text></g>
    <g transform="translate(20 170)"><rect width="246" height="126" rx="16" fill="#f8f2ff" stroke="#9333ea" stroke-opacity=".38"/><path d="M20 25L30 20L40 25V35C40 43 34 49 30 51C26 49 20 43 20 35Z" fill="none" stroke="#7c3aed" stroke-width="2"/><text x="51" y="34" class="node">Policy engine + approvals</text><text x="20" y="68" class="copy">Caps · allowlists · cooldowns</text><text x="20" y="89" class="copy">Expiry · reservations · simulation</text><text x="20" y="110" class="copy">Human approval when required</text></g>
    <g transform="translate(20 318)"><rect width="246" height="82" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-opacity=".28"/><text x="20" y="32" class="node">Payment intent store</text><text x="20" y="55" class="copy">PostgreSQL locks and workflow state</text></g>
    <g transform="translate(20 422)"><rect width="246" height="98" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-opacity=".28"/><text x="20" y="32" class="node">Notifications and automation</text><text x="20" y="55" class="copy">Alerts · approval expiry · pause</text><text x="20" y="76" class="copy">Settlement runs independently</text></g>
  </g>

  <g transform="translate(642 164)">
    <rect width="260" height="542" rx="22" fill="#f7fbff" stroke="#0284c7" stroke-opacity=".28"/><text x="24" y="34" class="layer" fill="#0369a1">3 · CIRCLE INFRASTRUCTURE</text>
    <g transform="translate(20 66)"><rect width="220" height="112" rx="16" fill="#fff" stroke="#0284c7" stroke-opacity=".3"/><circle cx="30" cy="32" r="14" fill="#2775ca"/><text x="30" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">$</text><text x="54" y="34" class="node">Developer Wallets</text><text x="20" y="68" class="copy">EOA and SCA execution</text><text x="20" y="89" class="copy">Backend-authorized signing</text></g>
    <g transform="translate(20 202)"><rect width="220" height="112" rx="16" fill="#fff" stroke="#0284c7" stroke-opacity=".3"/><text x="20" y="34" class="node">Gateway + Nanopayments</text><text x="20" y="68" class="copy">Unified USDC balance views</text><text x="20" y="89" class="copy">HTTP 402 payment responses</text></g>
    <g transform="translate(20 338)"><rect width="220" height="112" rx="16" fill="#fff" stroke="#0284c7" stroke-opacity=".3"/><text x="20" y="34" class="node">Agent Marketplace paths</text><text x="20" y="68" class="copy">Inspect compatible services</text><text x="20" y="89" class="copy">Execute approved intents</text></g>
    <g transform="translate(20 474)"><rect width="220" height="46" rx="14" fill="#f5faff" stroke="#0284c7" stroke-opacity=".25"/><text x="20" y="29" class="node" style="font-size:13px">USDC payment authorization</text></g>
  </g>

  <g transform="translate(938 164)">
    <rect width="416" height="336" rx="22" fill="#f4fcf8" stroke="#059669" stroke-opacity=".3"/><text x="24" y="34" class="layer" fill="#047857">4 · ARC TESTNET · 5042002</text><text x="268" y="34" class="copy" fill="#047857" style="font-size:10px">USDC PAYMENT + GAS</text>
    <g transform="translate(20 62)"><rect width="178" height="72" rx="15" fill="#fff" stroke="#059669" stroke-opacity=".28"/><text x="18" y="30" class="node">Policy Registry</text><text x="18" y="52" class="copy">Onchain enforcement</text></g><g transform="translate(218 62)"><rect width="178" height="72" rx="15" fill="#fff" stroke="#059669" stroke-opacity=".28"/><text x="18" y="30" class="node">x402 ledger</text><text x="18" y="52" class="copy">Service settlement</text></g>
    <g transform="translate(20 154)"><rect width="178" height="72" rx="15" fill="#fff" stroke="#059669" stroke-opacity=".28"/><text x="18" y="30" class="node">Escrow</text><text x="18" y="52" class="copy">Fund · verify · release</text></g><g transform="translate(218 154)"><rect width="178" height="72" rx="15" fill="#fff" stroke="#059669" stroke-opacity=".28"/><text x="18" y="30" class="node">Save/Earn</text><text x="18" y="52" class="copy">Profiles · guarded routing</text></g>
    <g transform="translate(20 246)"><rect width="178" height="68" rx="15" fill="#fff" stroke="#059669" stroke-opacity=".28"/><text x="18" y="29" class="node">Memo + reputation</text><text x="18" y="50" class="copy">Context and history</text></g><g transform="translate(218 246)"><rect width="178" height="68" rx="15" fill="#fff" stroke="#059669" stroke-opacity=".28"/><text x="18" y="29" class="node">Stablecoin swaps</text><text x="18" y="50" class="copy">Verified Arc routes</text></g>
  </g>

  <g transform="translate(938 530)">
    <rect width="416" height="176" rx="22" fill="#fff" stroke="#64748b" stroke-opacity=".22"/><text x="24" y="34" class="layer" fill="#475569">5 · EVIDENCE AND OPERATIONS</text>
    <g transform="translate(20 58)"><rect width="116" height="94" rx="15" fill="#f8fafc" stroke="#64748b" stroke-opacity=".22"/><text x="16" y="32" class="node">Receipts</text><text x="16" y="56" class="copy">Scope-safe</text><text x="16" y="75" class="copy">settlement proof</text></g><g transform="translate(150 58)"><rect width="116" height="94" rx="15" fill="#f8fafc" stroke="#64748b" stroke-opacity=".22"/><text x="16" y="32" class="node">Indexer</text><text x="16" y="56" class="copy">Arc events</text><text x="16" y="75" class="copy">and cursors</text></g><g transform="translate(280 58)"><rect width="116" height="94" rx="15" fill="#f8fafc" stroke="#64748b" stroke-opacity=".22"/><text x="16" y="32" class="node">Analytics</text><text x="16" y="56" class="copy">Fees separated</text><text x="16" y="75" class="copy">from volume</text></g>
  </g>

  <path d="M264 273H300Q310 273 310 283V267Q310 253 324 253H340" class="rail purple dash" marker-end="url(#purpleArrow)"/><path d="M264 401H302Q312 401 312 359H340" class="rail purple dash" marker-end="url(#purpleArrow)"/><path d="M264 529H304Q314 529 314 253H340" class="rail purple dash" marker-end="url(#purpleArrow)"/>
  <path d="M586 397H618Q628 397 628 286H662" class="rail blue dash" marker-end="url(#blueArrow)"/><path d="M463 460V482" class="rail purple dash" marker-end="url(#purpleArrow)"/><path d="M586 397H618Q628 397 628 422H662" class="rail blue dash" marker-end="url(#blueArrow)"/>
  <path d="M882 286H918Q928 286 928 262H958" class="rail green dash" marker-end="url(#greenArrow)"/><path d="M882 422H916Q928 422 928 635H958" class="rail blue dash" marker-end="url(#blueArrow)"/><path d="M1146 480V520Q1146 530 1136 530V588" class="rail green dash" marker-end="url(#greenArrow)"/><path d="M1245 480V588" class="rail green dash" marker-end="url(#greenArrow)"/><path d="M1204 635H1218" class="rail blue dash" marker-end="url(#blueArrow)"/>
  <g class="packet"><circle r="5.5" fill="#7c3aed"><animateMotion dur="4.6s" repeatCount="indefinite" path="M264 401H302Q312 401 312 359H340"/></circle><circle r="5" fill="#7c3aed"><animateMotion dur="5.4s" begin="-2.2s" repeatCount="indefinite" path="M264 529H304Q314 529 314 253H340"/></circle><circle r="5.5" fill="#0284c7"><animateMotion dur="4.4s" repeatCount="indefinite" path="M586 397H618Q628 397 628 286H662"/></circle><circle r="5" fill="#0284c7"><animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite" path="M586 397H618Q628 397 628 422H662"/></circle><circle r="6" fill="#059669"><animateMotion dur="4.2s" repeatCount="indefinite" path="M882 286H918Q928 286 928 262H958"/></circle><circle r="5" fill="#0284c7"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite" path="M882 422H916Q928 422 928 635H958"/></circle><circle r="5.5" fill="#059669"><animateMotion dur="3.8s" repeatCount="indefinite" path="M1245 480V588"/></circle></g>
  <g transform="translate(50 754)"><circle cx="7" cy="7" r="5" fill="#7c3aed"/><text x="20" y="12" class="copy">request and approval context</text><circle cx="254" cy="7" r="5" fill="#0284c7"/><text x="267" y="12" class="copy">Circle wallet and Gateway execution</text><circle cx="566" cy="7" r="5" fill="#059669"/><text x="579" y="12" class="copy">Arc settlement and evidence</text></g>
  <text x="50" y="808" class="copy">Base Sepolia and Arbitrum Sepolia provide secondary Circle-compatible test routes. Arc remains the primary contract and product environment.</text>
</svg>
